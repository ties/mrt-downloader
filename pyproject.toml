[project]
name = "mrt-downloader"
version = "0.19.0"
description = ""
authors = [{name="Ties de Kock", email="ties@tiesdekock.nl"}]
requires-python = ">=3.12"
readme = "README.md"
packages = [{include = "mrt_downloader"}]
dependencies = [
    "aiohttp>=3.14.4",
    "aiosqlite>=0.22.1",
    "click>=8.5.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
mrt-downloader = "mrt_downloader.cli:cli"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
lint.extend-select = ["I"]
lint.ignore = ["E501"]

[tool.pytest]
junit_family = "xunit2"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]
